<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Metadata -->
    <title>GoodFind</title>
    <meta name="title" content="GoodFind" />
    <meta name="description" content="Shop curated workspace furniture, studio audio gear, everyday linen apparel, and handcrafted home provisions. Directly sourced from independent makers with transparent material specs, direct artisan warranty, and prepaid 7-day doorstep returns." />
    <meta name="keywords" content="curated storefront, ergonomic standing desks, acoustic wireless headphones, mechanical keyboards, everyday linen clothing, artisan ceramics, single-origin coffee, direct to consumer store, independent makers" />
    <meta name="author" content="GoodFind" />
    <link rel="canonical" href="https://goodfind-shop.onrender.com/" />

    <!-- Crawler Directives -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GoodFind" />
    <meta property="og:url" content="https://goodfind-shop.onrender.com/" />
    <meta property="og:title" content="GoodFind" />
    <meta property="og:description" content="Shop curated workspace furniture, studio audio gear, everyday linen apparel, and handcrafted home provisions directly from independent makers with prepaid 7-day doorstep returns." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=1200&h=630&auto=format&fit=crop&q=85" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GoodFind Curated Storefront Collection" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@goodfind" />
    <meta name="twitter:creator" content="@goodfind" />
    <meta name="twitter:url" content="https://goodfind-shop.onrender.com/" />
    <meta name="twitter:title" content="GoodFind" />
    <meta name="twitter:description" content="Shop curated workspace furniture, studio audio gear, everyday linen apparel, and handcrafted home provisions directly from independent makers with prepaid 7-day doorstep returns." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=1200&h=630&auto=format&fit=crop&q=85" />

    <!-- Structured Data (JSON-LD) for Search Engines & AI Crawlers -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "OnlineStore",
          "@id": "https://goodfind-shop.onrender.com/#store",
          "name": "GoodFind",
          "url": "https://goodfind-shop.onrender.com/",
          "description": "Curated direct-to-consumer storefront offering thoughtfully engineered workspace furniture, studio audio gear, everyday linen apparel, and handcrafted living provisions directly from independent makers.",
          "logo": "https://goodfind-shop.onrender.com/logo.svg",
          "image": "https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=1200&h=630&auto=format&fit=crop&q=85",
          "priceRange": "₹199 - ₹35,999",
          "currenciesAccepted": "INR, USD",
          "paymentAccepted": "Credit Card, Apple Pay, UPI",
          "hasMerchantReturnPolicy": {
            "@type": "MerchantReturnPolicy",
            "applicableCountry": "IN",
            "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow",
            "merchantReturnDays": 7,
            "returnMethod": "https://schema.org/ReturnByMail",
            "returnFees": "https://schema.org/FreeReturn"
          },
          "shippingDetails": {
            "@type": "OfferShippingDetails",
            "shippingRate": {
              "@type": "MonetaryAmount",
              "value": "0",
              "currency": "INR"
            },
            "deliveryTime": {
              "@type": "ShippingDeliveryTime",
              "handlingTime": {
                "@type": "QuantitativeValue",
                "minValue": 0,
                "maxValue": 1,
                "unitCode": "DAY"
              },
              "transitTime": {
                "@type": "QuantitativeValue",
                "minValue": 2,
                "maxValue": 5,
                "unitCode": "DAY"
              }
            }
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://goodfind-shop.onrender.com/#website",
          "name": "GoodFind",
          "url": "https://goodfind-shop.onrender.com/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://goodfind-shop.onrender.com/#/catalog?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
